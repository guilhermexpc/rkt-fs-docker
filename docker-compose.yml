version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nodejs
    container_name: api-nodejs
    ports:
      - "3333:3333"
    depends_on:
      - postgres
  postgres:
    image: "docker pull postgres:alpine3.24"
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      PROSTGRES_PASSWORD: postgres
      PROSTGRES_DB: api
    volumes:
      - database:/var/lib/postgresql/data

volumes:
  database:
