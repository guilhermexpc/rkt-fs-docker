services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nodejs
    container_name: api-nodejs
    ports:
      - "3333:3333"
    depends_on:
      - postgres
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api
    volumes:
      - database:/var/lib/postgresql

volumes:
  database:
